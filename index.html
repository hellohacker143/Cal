<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CalcNote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#222;--bar:#0288d1;--gut:#eee;--line:#d8d8d8;--acc:#0288d1;--card:#f6f6f6;--num:#a00;--word:#2e7d32;--op:#e69500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#eee;--gut:#2a2a2a;--line:#3a3a3a;--card:#262626;--num:#ff8a80;--word:#81c784}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:20px;font-weight:500}
header b{flex:1;font-weight:500}header button{background:none;border:0;color:#fff;font-size:24px;padding:0 6px}
#calc,#prod{flex:1;display:none;min-height:0;flex-direction:column}
.on{display:flex!important}
#wrap{flex:1;overflow-y:auto;display:flex;align-items:flex-start}
#gut{white-space:pre;width:44px;background:var(--gut);color:var(--num);text-align:right;padding:8px 8px 8px 0;font-size:20px;line-height:32px;flex:none}
#ed{flex:1;min-width:0;border:0;border-right:1px solid var(--line);outline:0;resize:none;background:var(--bg);color:var(--fg);font:20px/32px Roboto,Arial,sans-serif;padding:8px 8px;white-space:pre;overflow:hidden}
#res{width:34%;padding:8px 10px;font-size:20px;line-height:32px;white-space:pre;overflow:hidden;flex:none}
#sug{display:none;max-height:190px;overflow-y:auto;background:var(--card);border-top:1px solid var(--line)}#sug table{width:100%;border-collapse:collapse;font-size:18px}#sug th{text-align:left;color:#888;font-size:14px;padding:6px 12px;border-bottom:1px solid var(--line)}#sug td{padding:11px 12px;border-bottom:1px solid var(--line)}#sug td:last-child{color:var(--acc)}
#sug button,.chip{border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:18px;padding:8px 14px;font-size:16px;white-space:nowrap}
#tot{background:var(--gut);padding:12px 16px;display:flex;justify-content:space-between;font-size:20px}
#tot span:first-child{color:var(--acc);font-weight:600}
#prod{padding:12px;overflow-y:auto}
input{font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:12px;margin-top:8px}
.row .n{flex:1}.row small{color:#888;display:block}.row input{width:90px;text-align:right}
.row .x{background:none;border:0;color:#c62828;font-size:20px}
.add{display:grid;grid-template-columns:1fr 70px 90px auto;gap:6px;margin-top:12px}
.add button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:0 14px;font-size:18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:14px;border:0;background:none;color:#888;font-size:16px;font-weight:600;border-top:3px solid transparent}
nav .on2{color:var(--acc);border-top-color:var(--acc)}
</style></head><body>
<header><b>CalcNote</b><button id="new" title="New">+</button><button id="save" title="Save">💾</button></header>
<section id="calc" class="on">
 <div id="wrap"><div id="gut">1</div><textarea id="ed" wrap="off" spellcheck="false" autocapitalize="off" placeholder="k*6"></textarea><div id="res"></div></div>
 <div id="sug"></div>
 <div id="tot"><span>Total:</span><span id="tv">0</span></div>
</section>
<section id="prod">
 <input id="q" type="search" placeholder="Search product (k, vg…)">
 <div id="list"></div>
 <div class="add"><input id="an" placeholder="Name"><input id="as" placeholder="Short"><input id="ap" type="number" placeholder="Price"><button id="ab">Add</button></div><div style="margin-top:18px;font-weight:600">Bulk add</div><textarea id="bulk" rows="5" placeholder="chota advans 90 ca&#10;vimal 130 vl" style="width:100%;margin-top:6px;font:17px/1.5 Roboto,Arial,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"></textarea><div class="add" style="grid-template-columns:1fr auto"><small id="bmsg" style="color:#888;align-self:center">One per line: name price short</small><button id="bb">Add all</button></div>
</section>
<nav><button id="t1" class="on2">Calculator</button><button id="t2">Products</button></nav>
<script>
var P=[{n:'kings',s:'k',p:219},{n:'vimal gutka',s:'vg',p:230}],ed=document.getElementById('ed');
function $(i){return document.getElementById(i)}
try{var d=JSON.parse(localStorage.getItem('cn_p')||'null');if(d)P=d;var t=localStorage.getItem('cn_t');if(t)ed.value=t}catch(e){}
function persist(){try{localStorage.setItem('cn_p',JSON.stringify(P));localStorage.setItem('cn_t',ed.value)}catch(e){}}
function fmt(v){return Number.isInteger(v)?v.toLocaleString('en-US'):(+v.toFixed(4)).toLocaleString('en-US',{maximumFractionDigits:4})}
function ev(line){
 var s=line.toLowerCase(),found=false;
 P.slice().sort(function(a,b){return b.n.length-a.n.length}).forEach(function(x){
  [x.n.toLowerCase(),x.s.toLowerCase()].forEach(function(k){if(!k)return;
   var re=new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])','g');
   s=s.replace(re,function(m,pre,off,str){var rest=str.slice(off+m.length);found=true;
    return pre+(/^\s*[\d(.]/.test(rest)?' ':'('+x.p+')')})})});
 s=s.replace(/[a-z_]+/g,' ').replace(/x/g,'*').replace(/,/g,'');
 if(!/\d/.test(s)||/[^\d+\-*\/().%\s]/.test(s))return null;
 s=s.replace(/(\d)\s*%/g,'($1/100)').replace(/\)\s*\(/g,')*(');
 try{var v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:null}catch(e){return null}}
function html(l){return l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function run(){
 var L=ed.value.split('\n'),out=[],tot=0;
 L.forEach(function(l){var v=ev(l);if(v===null)out.push('');else{out.push(fmt(v));tot+=v}});
 $('res').textContent=out.join('\n');
 $('gut').textContent=L.map(function(_,i){return i+1}).join('\n');
 var h=Math.max(L.length,18)*32+16;ed.style.height=h+'px';$('res').style.height=h+'px';$('gut').style.height=h+'px';
 $('tv').textContent=fmt(tot);suggest();persist()}
function word(){var c=ed.selectionStart,t=ed.value.slice(0,c),m=t.match(/([a-zA-Z]+)$/);return m?{w:m[1],s:c-m[1].length,e:c}:null}
function suggest(){
 var w=word(),box=$('sug');box.innerHTML='';
 if(!w){box.style.display='none';return}
 var q=w.w.toLowerCase(),r=P.filter(function(x){return x.n.toLowerCase().indexOf(q)===0||x.s.toLowerCase().indexOf(q)===0||x.n.toLowerCase().indexOf(q)>0});
 r=r.filter(function(x){return x.n.toLowerCase()!==q});
 if(!r.length){box.style.display='none';return}
 box.style.display='block';var tb=document.createElement('table');tb.innerHTML='<tr><th>S/No</th><th>Short</th><th>Product</th></tr>';box.appendChild(tb);
 r.forEach(function(x){var b=document.createElement('tr');b.innerHTML='<td>'+(P.indexOf(x)+1)+'</td><td>'+html(x.s)+'</td><td><b>'+html(x.n)+' '+x.p+'*</b></td>';
  b.onmousedown=function(e){e.preventDefault()};
  b.onclick=function(){var v=ed.value;var ins=x.n+' '+x.p+'*';ed.value=v.slice(0,w.s)+ins+v.slice(w.e);var c=w.s+ins.length;ed.focus();ed.setSelectionRange(c,c);run()};
  tb.appendChild(b)})}
ed.addEventListener('input',run);ed.addEventListener('keyup',suggest);ed.addEventListener('click',suggest);
ed.addEventListener('keydown',function(e){if(e.key==='Tab'){var b=$('sug').firstChild;if(b){e.preventDefault();b.click()}}});
$('new').onclick=function(){if(!ed.value||confirm('Clear note?')){ed.value='';run()}};
$('save').onclick=function(){persist();this.textContent='✅';var b=this;setTimeout(function(){b.textContent='💾'},900)};
function tab(n){$('calc').classList.toggle('on',n==1);$('prod').classList.toggle('on',n==2);$('t1').classList.toggle('on2',n==1);$('t2').classList.toggle('on2',n==2);if(n==2)draw()}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
function draw(){
 var q=$('q').value.toLowerCase(),box=$('list');box.innerHTML='';
 P.forEach(function(x,i){if(q&&(x.n+' '+x.s).toLowerCase().indexOf(q)<0)return;
  var r=document.createElement('div');r.className='row';
  r.innerHTML='<span style="width:24px;color:#888">'+(i+1)+'</span><div class="n">'+html(x.n)+'<small>short: '+html(x.s)+'</small></div><input type="number" value="'+x.p+'"><button class="x">✕</button>';
  r.querySelector('input').onchange=function(){x.p=+this.value||0;persist()};
  r.querySelector('.x').onclick=function(){P.splice(i,1);persist();draw()};
  box.appendChild(r)});
 if(!box.children.length)box.innerHTML='<p style="color:#888;text-align:center;margin-top:24px">No product found</p>'}
$('q').oninput=draw;
$('bb').onclick=function(){var n=0;$('bulk').value.split('\n').forEach(function(l){var m=l.trim().match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*([a-zA-Z]*)$/);if(!m)return;var nm=m[1].trim(),ex=P.filter(function(x){return x.n.toLowerCase()===nm.toLowerCase()})[0];if(ex){ex.p=+m[2];if(m[3])ex.s=m[3]}else P.push({n:nm,s:m[3],p:+m[2]});n++});$('bulk').value='';$('bmsg').textContent=n+' added/updated';persist();draw()};
$('ab').onclick=function(){var n=$('an').value.trim(),p=+$('ap').value;if(!n||!p)return;P.push({n:n,s:$('as').value.trim(),p:p});$('an').value=$('as').value=$('ap').value='';persist();draw()};
if(!ed.value)ed.value='kings 219*6';run();
</script></body></html>
