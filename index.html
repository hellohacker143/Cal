<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CalcNote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#222;--bar:#0288d1;--gut:#eee;--line:#d8d8d8;--acc:#0288d1;--card:#f6f6f6;--num:#a00;--word:#2e7d32;--op:#e69500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#eee;--gut:#2a2a2a;--line:#3a3a3a;--card:#262626;--num:#ff8a80;--word:#81c784}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-height:480px;overflow:hidden}#wrap,#prod{min-height:200px}@media(max-width:480px){#res{width:38%}#gut{width:36px;font-size:18px}#ed,#res{font-size:18px}header{padding:10px 12px}.row{padding:10px;gap:8px}.row input{width:76px}}
body{background:var(--bg);color:var(--fg);font-family:Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:20px;font-weight:500}
header b{flex:1;font-weight:500}header button{background:none;border:0;color:#fff;font-size:24px;padding:0 6px}
#calc,#prod,#bills,#sales,#set{flex:1;display:none;min-height:0;flex-direction:column}
.on{display:flex!important}
#wrap{flex:1;overflow-y:auto;display:flex;align-items:flex-start}
#gut{white-space:pre;width:44px;background:var(--gut);color:var(--num);text-align:right;padding:8px 8px 8px 0;font-size:20px;line-height:32px;flex:none}
#ed{flex:1;min-width:0;border:0;border-right:1px solid var(--line);outline:0;resize:none;background:var(--bg);color:var(--fg);font:20px/32px Roboto,Arial,sans-serif;padding:8px 8px;white-space:pre;overflow:hidden}
#res{width:34%;padding:8px 10px;font-size:20px;line-height:32px;white-space:pre;overflow:hidden;flex:none}
#sug{display:none;max-height:190px;overflow-y:auto;background:var(--card);border-top:1px solid var(--line)}#sug table{width:100%;border-collapse:collapse;font-size:18px}#sug th{text-align:left;color:#888;font-size:14px;padding:6px 12px;border-bottom:1px solid var(--line)}#sug td{padding:11px 12px;border-bottom:1px solid var(--line)}#sug td:last-child{color:var(--acc)}
#sug button,.chip{border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:18px;padding:8px 14px;font-size:16px;white-space:nowrap}
#tot{background:var(--gut);padding:12px 16px;display:flex;justify-content:space-between;font-size:20px}
#tot span:first-child{color:var(--acc);font-weight:600}
#prod{padding:0 12px 16px;overflow-y:auto}#prod>*{flex:none;width:100%;max-width:640px;margin-left:auto;margin-right:auto}#q{position:sticky;top:12px;margin-top:12px;box-shadow:0 0 0 10px var(--bg);z-index:2}@media(max-width:360px){.add{grid-template-columns:1fr 1fr}}
input{font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:12px;margin-top:8px}
.row .n{flex:1}.row small{color:#888;display:block}.row input{width:90px;text-align:right}
.row .x{background:none;border:0;color:#c62828;font-size:20px}
.add{display:grid;grid-template-columns:1fr 70px 90px auto;gap:6px;margin-top:12px}
.add button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:0 14px;font-size:18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:14px;border:0;background:none;color:#888;font-size:16px;font-weight:600;border-top:3px solid transparent}
nav .on2{color:var(--acc);border-top-color:var(--acc)}
#billv{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.bh{background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:20px}.bh b{font-weight:500}.bh span{flex:1;font-size:12px;opacity:.85}.bh button{background:none;border:0;color:#fff;font-size:22px}.bs{flex:1;overflow:auto;padding:12px}.bs table{width:100%;border-collapse:collapse;font-size:17px}.bs th{text-align:left;color:#888;font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line)}.bs td{padding:10px 4px;border-bottom:1px solid var(--line)}.bs th:nth-child(n+3),.bs td:nth-child(n+3){text-align:right}.bt{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:14px 4px;border-top:2px solid var(--fg);margin-top:8px}
#bills,#sales,#set{padding:0 12px 16px;overflow-y:auto}#set{padding-top:8px}#set label{display:block;margin-top:16px;color:#888;font-size:14px}#set input{margin-top:6px}#sv{margin-top:20px;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:18px;align-self:flex-start}#bshop{text-align:center;font-size:22px;font-weight:700;padding:4px 0 10px}#blist{padding-top:4px}.emp{color:#888;text-align:center;margin-top:24px}#scards{display:flex;gap:10px;margin-top:12px}.sc{flex:1;background:var(--card);border-radius:10px;padding:12px}.sc b{display:block;font-size:26px;margin:4px 0}.sc small{color:#888}#sd{margin-top:12px}#sdays table{width:100%;border-collapse:collapse;margin-top:14px;font-size:17px}#sdays th{text-align:left;color:#888;font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line)}#sdays td{padding:11px 4px;border-bottom:1px solid var(--line)}#sdays th:nth-child(n+2),#sdays td:nth-child(n+2){text-align:right}
#scrim{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:19}#drawer{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:80%;background:var(--bg);z-index:20;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}#drawer.open{transform:none}.dh{background:var(--bar);color:#fff;padding:20px 16px}.dh b{font-size:22px;font-weight:500}.dh small{display:block;margin-top:14px;opacity:.85}#dts{font-size:26px;font-weight:600}#drawer button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font-size:18px;padding:16px}#drawer button.cur{color:var(--acc);background:var(--card)}
@media print{body{height:auto!important;overflow:visible}header,nav,#calc,#prod,.bh button{display:none!important}#billv{position:static;display:flex!important}.bh{background:none;color:#000}.bs{overflow:visible}}
</style></head><body>
<header><button id="mn">☰</button><b><span id="ttl">CalcNote</span><small id="shp" style="display:none;font-size:12px;font-weight:400;opacity:.9"></small></b><button id="bl" title="Bill preview">🧾</button><button id="new" title="New">+</button><button id="save" title="Save">💾</button></header>
<section id="calc" class="on">
 <div id="wrap"><div id="gut">1</div><textarea id="ed" wrap="off" spellcheck="false" autocapitalize="off" placeholder="k*6"></textarea><div id="res"></div></div>
 <div id="sug"></div>
 <div id="tot"><span>Total:</span><span id="tv">0</span></div>
</section>
<section id="prod">
 <input id="q" type="search" placeholder="Search product (k, vg…)">
 <div id="list"></div>
 <div class="add"><input id="an" placeholder="Name"><input id="as" placeholder="Short"><input id="ap" type="number" placeholder="Price"><button id="ab">Add</button></div><div style="margin-top:18px;font-weight:600">Bulk add</div><textarea id="bulk" rows="5" placeholder="chota advans 90 ca&#10;vimal 130 vl" style="display:block;width:100%;min-height:130px;resize:vertical;margin-top:6px;font:17px/1.5 Roboto,Arial,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"></textarea><div class="add" style="grid-template-columns:1fr auto"><small id="bmsg" style="color:#888;align-self:center">One per line: name price short</small><button id="bb">Add all</button></div>
</section>
<section id="bills"><div id="blist"></div></section>
<section id="sales"><input type="date" id="sd"><div id="scards"></div><div id="sdays"></div></section>
<section id="set"><label>App name</label><input id="sa" placeholder="CalcNote"><label>Shop name</label><input id="ss" placeholder="e.g. Dhanalaxmi"><button id="sv">Save</button><p id="smsg" style="color:#2e7d32"></p></section>
<div id="scrim"></div><aside id="drawer"><div class="dh"><b id="dtl">CalcNote</b><small>Today's sales</small><div id="dts">0</div></div><button data-v="1">🧮 Calculator</button><button data-v="2">📦 Products</button><button data-v="3">🧾 Saved Bills</button><button data-v="4">📊 Sales (calendar)</button><button data-v="5">⚙️ Settings</button></aside>
<div id="billv"><div class="bh"><b>Bill</b><span id="bdate"></span><button id="bprint">🖨</button><button id="bclose">✕</button></div><div class="bs"><div id="bshop"></div><table><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody id="bbody"></tbody></table><div class="bt"><span>Total</span><span id="btot"></span></div></div></div>
<nav><button id="t1" class="on2">Calculator</button><button id="t2">Products</button></nav>
<script>
var P=[{n:'kings',s:'k',p:219},{n:'vimal gutka',s:'vg',p:230}],ed=document.getElementById('ed');
function $(i){return document.getElementById(i)}
try{var d=JSON.parse(localStorage.getItem('cn_p')||'null');if(d)P=d;var t=localStorage.getItem('cn_t');if(t)ed.value=t}catch(e){}
function persist(){try{localStorage.setItem('cn_p',JSON.stringify(P));localStorage.setItem('cn_t',ed.value)}catch(e){}}
function fmt(v){return Number.isInteger(v)?v.toLocaleString('en-US'):(+v.toFixed(4)).toLocaleString('en-US',{maximumFractionDigits:4})}
function ev(line){
 var s=line.toLowerCase(),found=false;
 P.slice().sort(function(a,b){return b.n.length-a.n.length}).forEach(function(x){
  [x.n.toLowerCase(),x.s.toLowerCase()].forEach(function(k){if(!k)return;
   var re=new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])','g');
   s=s.replace(re,function(m,pre,off,str){var rest=str.slice(off+m.length);found=true;
    return pre+(/^\s*[\d(.]/.test(rest)?' ':'('+x.p+')')})})});
 s=s.replace(/[a-z_]+/g,' ').replace(/x/g,'*').replace(/,/g,'');
 if(!/\d/.test(s)||/[^\d+\-*\/().%\s]/.test(s))return null;
 s=s.replace(/(\d)\s*%/g,'($1/100)').replace(/\)\s*\(/g,')*(');
 try{var v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:null}catch(e){return null}}
function html(l){return l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function run(){
 var L=ed.value.split('\n'),out=[],tot=0;
 L.forEach(function(l){var v=ev(l);if(v===null)out.push('');else{out.push(fmt(v));tot+=v}});
 $('res').textContent=out.join('\n');
 $('gut').textContent=L.map(function(_,i){return i+1}).join('\n');
 var h=Math.max(L.length,18)*32+16;ed.style.height=h+'px';$('res').style.height=h+'px';$('gut').style.height=h+'px';
 $('tv').textContent=fmt(tot);suggest();persist()}
function word(){var c=ed.selectionStart,t=ed.value.slice(0,c),m=t.match(/([a-zA-Z]+)$/);return m?{w:m[1],s:c-m[1].length,e:c}:null}
function suggest(){
 var w=word(),box=$('sug');box.innerHTML='';
 if(!w){box.style.display='none';return}
 var q=w.w.toLowerCase(),r=P.filter(function(x){return x.n.toLowerCase().indexOf(q)===0||x.s.toLowerCase().indexOf(q)===0||x.n.toLowerCase().indexOf(q)>0});
 r=r.filter(function(x){return x.n.toLowerCase()!==q});
 if(!r.length){box.style.display='none';return}
 box.style.display='block';var tb=document.createElement('table');tb.innerHTML='<tr><th>S/No</th><th>Short</th><th>Product</th></tr>';box.appendChild(tb);
 r.forEach(function(x){var b=document.createElement('tr');b.innerHTML='<td>'+(P.indexOf(x)+1)+'</td><td>'+html(x.s)+'</td><td><b>'+html(x.n)+' '+x.p+'*</b></td>';
  b.onmousedown=function(e){e.preventDefault()};
  b.onclick=function(){var v=ed.value;var ins=x.n+' '+x.p+'*';ed.value=v.slice(0,w.s)+ins+v.slice(w.e);var c=w.s+ins.length;ed.focus();ed.setSelectionRange(c,c);run()};
  tb.appendChild(b)})}
ed.addEventListener('input',run);ed.addEventListener('keyup',suggest);ed.addEventListener('click',suggest);
ed.addEventListener('keydown',function(e){if(e.key==='Tab'){var b=$('sug').firstChild;if(b){e.preventDefault();b.click()}}});
$('new').onclick=function(){if(!ed.value||confirm('Clear note?')){ed.value='';run()}};
$('save').onclick=function(){persist();this.textContent='✅';var b=this;setTimeout(function(){b.textContent='💾'},900)};
function tab(n){$('calc').classList.toggle('on',n==1);$('prod').classList.toggle('on',n==2);$('t1').classList.toggle('on2',n==1);$('t2').classList.toggle('on2',n==2);if(n==2)draw()}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
function draw(){
 var q=$('q').value.toLowerCase(),box=$('list');box.innerHTML='';
 P.forEach(function(x,i){if(q&&(x.n+' '+x.s).toLowerCase().indexOf(q)<0)return;
  var r=document.createElement('div');r.className='row';
  r.innerHTML='<span style="width:24px;color:#888">'+(i+1)+'</span><div class="n">'+html(x.n)+'<small>short: '+html(x.s)+'</small></div><input type="number" value="'+x.p+'"><button class="x">✕</button>';
  r.querySelector('input').onchange=function(){x.p=+this.value||0;persist()};
  r.querySelector('.x').onclick=function(){P.splice(i,1);persist();draw()};
  box.appendChild(r)});
 if(!box.children.length)box.innerHTML='<p style="color:#888;text-align:center;margin-top:24px">No product found</p>'}
$('q').oninput=draw;
$('bb').onclick=function(){var n=0;$('bulk').value.split('\n').forEach(function(l){var m=l.trim().match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*([a-zA-Z]*)$/);if(!m)return;var nm=m[1].trim(),ex=P.filter(function(x){return x.n.toLowerCase()===nm.toLowerCase()})[0];if(ex){ex.p=+m[2];if(m[3])ex.s=m[3]}else P.push({n:nm,s:m[3],p:+m[2]});n++});$('bulk').value='';$('bmsg').textContent=n+' added/updated';persist();draw()};
$('ab').onclick=function(){var n=$('an').value.trim(),p=+$('ap').value;if(!n||!p)return;P.push({n:n,s:$('as').value.trim(),p:p});$('an').value=$('as').value=$('ap').value='';persist();draw()};
function findP(l){var best=null;P.slice().sort(function(a,b){return b.n.length-a.n.length}).some(function(x){return [x.n,x.s].some(function(k){if(!k)return false;var m=new RegExp('(^|[^a-zA-Z])('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![a-zA-Z])','i').exec(l);if(m){best={p:x,rest:l.slice(m.index+m[1].length+m[2].length)};return true}return false})});return best}
function showBill(){var rows=[],tot=0,n=0;
 ed.value.split('\n').forEach(function(l){var v=ev(l);if(v===null)return;n++;var f=findP(l),item,qty='',rate='';
  if(f){item=f.p.n;var r=f.rest.replace(/,/g,'').trim(),m;
   if(m=r.match(/^(\d+(?:\.\d+)?)\s*[*x]\s*(\d+(?:\.\d+)?)$/i)){rate=+m[1];qty=+m[2]}
   else if(m=r.match(/^[*x]\s*(\d+(?:\.\d+)?)$/i)){rate=f.p.p;qty=+m[1]}
   else{rate=v;qty=1}}
  else{item=l.replace(/[^a-zA-Z ]/g,'').trim()||'Item'}
  tot+=v;rows.push('<tr><td>'+n+'</td><td>'+html(item)+'</td><td>'+qty+'</td><td>'+(rate===''?'':fmt(rate))+'</td><td>'+fmt(v)+'</td></tr>')});
 $('bbody').innerHTML=rows.join('')||'<tr><td colspan="5" style="text-align:center;color:#888">No items</td></tr>';
 $('btot').textContent=fmt(tot);$('bdate').textContent=new Date().toLocaleString();$('billv').style.display='flex'}
$('bl').onclick=showBill;$('bclose').onclick=function(){$('billv').style.display='none'};$('bprint').onclick=function(){window.print()};
var B=[],curId=null;try{B=JSON.parse(localStorage.getItem('cn_b')||'[]')||[]}catch(e){}
function saveB(){try{localStorage.setItem('cn_b',JSON.stringify(B))}catch(e){}}
function dk(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function sumTxt(txt){var s=0;txt.split('\n').forEach(function(l){var v=ev(l);if(v!==null)s+=v});return s}
function todayTot(){var k=dk(Date.now()),s=0;B.forEach(function(b){if(dk(b.t)===k)s+=b.total});return s}
function drawBills(){var box=$('blist');box.innerHTML='';if(!B.length){box.innerHTML='<p class="emp">No saved bills yet. Tap the save button to save a bill.</p>';return}
 B.forEach(function(b){var d=new Date(b.t),c=document.createElement('div');c.className='row';c.style.cursor='pointer';
  var pv=b.txt.split('\n').filter(function(x){return x.trim()}).slice(0,2).join(' · ');
  c.innerHTML='<div class="n"><b>'+html(d.toLocaleDateString())+' '+html(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))+'</b><small>'+html(pv)+'</small></div><b>'+fmt(b.total)+'</b><button class="x">✕</button>';
  c.onclick=function(){ed.value=b.txt;curId=b.id;run();tab(1);showBill()};
  c.querySelector('.x').onclick=function(e){e.stopPropagation();if(confirm('Delete this bill?')){B=B.filter(function(z){return z.id!==b.id});saveB();drawBills()}};
  box.appendChild(c)})}
function drawSales(){var sd=$('sd');if(!sd.value)sd.value=dk(Date.now());var k=sd.value,tt=0,tc=0,st=0,sc=0,days={},td=dk(Date.now());
 B.forEach(function(b){var d=dk(b.t);days[d]=days[d]||{s:0,c:0};days[d].s+=b.total;days[d].c++;if(d===td){tt+=b.total;tc++}if(d===k){st+=b.total;sc++}});
 $('scards').innerHTML='<div class="sc"><small>Today</small><b>'+fmt(tt)+'</b><small>'+tc+' bills</small></div><div class="sc"><small>'+html(k)+'</small><b>'+fmt(st)+'</b><small>'+sc+' bills</small></div>';
 var ks=Object.keys(days).sort().reverse(),h='<table><thead><tr><th>Date</th><th>Bills</th><th>Sales</th></tr></thead><tbody>';
 ks.forEach(function(d){h+='<tr data-d="'+d+'"><td>'+d+'</td><td>'+days[d].c+'</td><td>'+fmt(days[d].s)+'</td></tr>'});
 $('sdays').innerHTML=ks.length?h+'</tbody></table>':'<p class="emp">No sales yet.</p>';
 Array.prototype.forEach.call($('sdays').querySelectorAll('tr[data-d]'),function(r){r.onclick=function(){sd.value=r.getAttribute('data-d');drawSales()}})}
$('sd').onchange=drawSales;
var S={a:'CalcNote',s:''};try{var q0=JSON.parse(localStorage.getItem('cn_s')||'null');if(q0)S=q0}catch(e){}
function applySet(){$('ttl').textContent=S.a||'CalcNote';$('shp').textContent=S.s;$('shp').style.display=S.s?'block':'none';$('dtl').textContent=S.s||S.a||'CalcNote';$('bshop').textContent=S.s;document.title=S.a||'CalcNote'}
$('sv').onclick=function(){S={a:$('sa').value.trim()||'CalcNote',s:$('ss').value.trim()};try{localStorage.setItem('cn_s',JSON.stringify(S))}catch(e){}applySet();$('smsg').textContent='Saved ✓'};
applySet();
function openD(){$('dts').textContent=fmt(todayTot());$('drawer').classList.add('open');$('scrim').style.display='block'}
function closeD(){$('drawer').classList.remove('open');$('scrim').style.display='none'}
function tab(n){['calc','prod','bills','sales','set'].forEach(function(id,i){$(id).classList.toggle('on',n==i+1)});$('t1').classList.toggle('on2',n==1);$('t2').classList.toggle('on2',n==2);if(n==2)draw();if(n==3)drawBills();if(n==4)drawSales();if(n==5){$('sa').value=S.a;$('ss').value=S.s;$('smsg').textContent=''}Array.prototype.forEach.call(document.querySelectorAll('#drawer button[data-v]'),function(b){b.classList.toggle('cur',b.getAttribute('data-v')==n)});closeD()}
$('mn').onclick=openD;$('scrim').onclick=closeD;
Array.prototype.forEach.call(document.querySelectorAll('#drawer button[data-v]'),function(b){b.onclick=function(){tab(+b.getAttribute('data-v'))}});
$('new').onclick=function(){if(!ed.value||confirm('Clear note?')){ed.value='';curId=null;run()}};
$('save').onclick=function(){var tot=sumTxt(ed.value),b=this;if(!tot){b.textContent='⚠️';setTimeout(function(){b.textContent='💾'},900);return}
 if(curId){var x=B.filter(function(z){return z.id===curId})[0];if(x){x.txt=ed.value;x.total=tot}else curId=null}
 if(!curId)B.unshift({id:Date.now(),t:Date.now(),txt:ed.value,total:tot});
 curId=null;saveB();ed.value='';run();b.textContent='✅';setTimeout(function(){b.textContent='💾'},900)};
function fit(){var h=window.innerHeight||document.documentElement.clientHeight;if(h>300)document.body.style.height=h+'px'}fit();window.addEventListener('resize',fit);
if(!ed.value)ed.value='kings 219*6';run();
</script></body></html>
